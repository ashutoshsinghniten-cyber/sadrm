
version: 2

updates:

  # Backend Maven dependencies
  - package-ecosystem: "maven"
    directory: "/SADRM_backend"
    schedule:
      interval: "weekly"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Backend Docker updates
  - package-ecosystem: "docker"
    directory: "/SADRM_backend"
    schedule:
      interval: "weekly"
