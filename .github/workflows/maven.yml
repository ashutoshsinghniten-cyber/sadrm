name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  maven-build:           # <-- yahan 'build' ki jagah 'maven-build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: SADRM_backend/pom.xml

      - name: Build with Maven
        run: mvn -B clean package -DskipTests --file SADRM_backend/pom.xml
