version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: sadrm-postgres
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_DB: sadrmp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sadrm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Local S3 (MinIO) ─────────────────────────────────────────────────────────
  # AWS S3 ki jagah local storage. Docker start hote hi bucket auto-create hoti hai.
  # Console: http://localhost:9001  |  Login: minioadmin / minioadmin
  # S3 API:  http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: sadrm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API port — app yahan connect karta hai
      - "9001:9001"   # Web console port — browser mein files dekho
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO init — bucket auto-create karta hai jab MinIO ready ho
  minio-init:
    image: minio/mc:latest
    container_name: sadrm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/sadrm-local;
        mc anonymous set download local/sadrm-local;
        echo 'Bucket sadrm-local ready.';
      "
    restart: "no"

  app:
    build: .
    container_name: sadrm-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/sadrmp?currentSchema=public&stringtype=unspecified
      DB_USER: postgres
      DB_PASS: root
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-strong-secret-at-least-32-chars}

      # ── Local MinIO config (AWS S3 nahi, local Docker MinIO) ────────────────
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: sadrm-local
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000   # app container se MinIO ka address

      # ── AI Runtime (optional) ────────────────────────────────────────────────
      AI_RUNTIME_ENDPOINT: ${AI_RUNTIME_ENDPOINT:-}
      AI_RUNTIME_MODEL: ${AI_RUNTIME_MODEL:-}
      AI_RUNTIME_API_KEY: ${AI_RUNTIME_API_KEY:-}
      AI_RUNTIME_VERSION: ${AI_RUNTIME_VERSION:-2023-06-01}
      AI_RUNTIME_AUTH_HEADER: ${AI_RUNTIME_AUTH_HEADER:-x-api-key}
      AI_RUNTIME_VERSION_HEADER: ${AI_RUNTIME_VERSION_HEADER:-anthropic-version}
      WORKFLOW_SNAPSHOT_HISTORY: "false"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
        reservations:
          memory: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:    # MinIO ka data yahan store hoga (Docker restart ke baad bhi safe rahega)
