spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: optional:dotenv:.env

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sadrmp?currentSchema=public&stringtype=unspecified}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: SadrmHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 30
          min-idle: 5

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 52MB

server:
  port: ${PORT:8080}
  tomcat:
    # Keep max-threads roughly 3-5× the Hikari pool size so threads don't pile up
    # waiting for DB connections. Prod overrides both in application-prod.yml.
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:80}
    connection-timeout: 20000
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/plain,text/event-stream

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-strong-secret-at-least-32-chars}

  aws:
    region: ${AWS_REGION:us-east-1}
    s3-bucket: ${AWS_S3_BUCKET:sadrm-local}
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
    # Local MinIO ke liye set karo. Production mein blank rakhna — real AWS use hoga.
    endpoint-url: ${AWS_ENDPOINT_URL:}
    # Browser-accessible URL for pre-signed URLs. Must differ from endpoint-url in Docker
    # because minio:9000 is Docker-internal and the browser can't resolve it.
    public-endpoint-url: ${AWS_PUBLIC_ENDPOINT_URL:}

  ai:
    endpoint: ${AI_RUNTIME_ENDPOINT:}
    model: ${AI_RUNTIME_MODEL:}
    cheap-model: ${AI_RUNTIME_CHEAP_MODEL:}
    api-key: ${AI_RUNTIME_API_KEY:}
    version: ${AI_RUNTIME_VERSION:}
    auth-header: ${AI_RUNTIME_AUTH_HEADER:x-api-key}
    version-header: ${AI_RUNTIME_VERSION_HEADER:anthropic-version}
    confidence-threshold: ${AI_CONFIDENCE_THRESHOLD:0.75}
    # Comma-separated Anthropic beta feature flags sent as the anthropic-beta header.
    # Required for PDF document extraction and prompt caching.
    beta-headers: ${AI_RUNTIME_BETA_HEADERS:pdfs-2024-09-25,prompt-caching-2024-07-31}

  workflow-snapshot-history: ${WORKFLOW_SNAPSHOT_HISTORY:false}

  preview:
    webp:
      enabled: ${WEBP_PREVIEW_ENABLED:true}
      dpi: ${WEBP_PREVIEW_DPI:220}
      quality: ${WEBP_PREVIEW_QUALITY:0.85}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.sadrm: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
