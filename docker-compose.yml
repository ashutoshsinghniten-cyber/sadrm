version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# SADRM — VM Deployment (AWS RDS + AWS S3 + Docker)
# No local Postgres container, no MinIO container — this uses your real
# AWS RDS instance and your real S3 bucket (test-data-sadrm) instead.
# Only Redis, the backend, and the frontend run in Docker on this VM.
# ─────────────────────────────────────────────────────────────────────────────

services:

  redis:
    image: redis:7-alpine
    container_name: sadrm-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    build: ./SADRM_backend
    container_name: sadrm-backend
    restart: unless-stopped
    env_file:
      - ./SADRM_backend/.env
    environment:
      # Docker-internal Redis hostname (overrides whatever is in .env, just in case)
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
        reservations:
          memory: 512m

  frontend:
    build: ./frontend
    container_name: sadrm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  redis_data:
