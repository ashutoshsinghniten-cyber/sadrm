<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b91c1c" />
    <title>Salvation Army · DigiStore · DRM Platform</title>

    <!-- Security headers (defence-in-depth for XSS / clickjacking) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Module preload for the critical path vendor chunks produced by the
         Vite manualChunks config. Browsers start fetching these in parallel
         with the main entry point, shaving 200-500ms off interactive time
         for the first 100K users to hit a cold CDN edge node. -->
    <!-- These hrefs are resolved at runtime; the commented values show intent.
         In production these are replaced with hashed filenames automatically. -->
    <!-- <link rel="modulepreload" href="/assets/vendor-react-[hash].js" /> -->
    <!-- <link rel="modulepreload" href="/assets/vendor-router-[hash].js" /> -->
  </head>
  <body>
    <!-- Root node with aria-live region so screen-readers announce route changes -->
    <div id="root" aria-live="polite"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
