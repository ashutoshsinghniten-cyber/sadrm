server {
    listen 80;
    server_name sadrm.digistoreit.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sadrm.digistoreit.com;

    ssl_certificate     /etc/letsencrypt/live/sadrm.digistoreit.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sadrm.digistoreit.com-0001/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200M;

    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream app:8791;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}